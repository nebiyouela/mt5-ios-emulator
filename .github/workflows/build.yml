name: Build iPhone IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: sh Tests/Static/run_all.sh
      - name: Restore iOS native dependencies
        id: sysroot
        uses: actions/cache@v4
        with:
          path: sysroot-ios-arm64
          key: ios-arm64-sysroot-c862bc145387000c4451fc6a654133f8784c3df7
      - name: Download upstream native dependencies
        if: steps.sysroot.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .dependencies
          gh run download 41750855227 --repo utmapp/UTM --name Sysroot-ios-arm64 --dir .dependencies
          tar -xzf .dependencies/sysroot.tgz
          test -d sysroot-ios-arm64
      - name: Install packaging tools
        run: brew install ldid
      - name: Build iPhone archive
        run: ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o "$PWD/build/MT5Emulator"
      - name: Package unsigned IPA
        run: |
          ./scripts/package.sh ipa "$PWD/build/MT5Emulator.xcarchive" "$PWD/build/package"
          mv build/package/UTM.ipa build/package/MT5-iOS-Emulator.ipa
          unzip -t build/package/MT5-iOS-Emulator.ipa > build/ipa-validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MT5-iOS-Emulator-unsigned
          path: build/package/MT5-iOS-Emulator.ipa
          if-no-files-found: error
